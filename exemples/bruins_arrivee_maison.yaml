# Annonce vocale à l'arrivée à la maison : les Bruins jouent-ils aujourd'hui, et le score.
#
# Si les Bruins jouent aujourd'hui, une video YouTube joue ensuite sur l'ecran.
#
# A adapter (3 lignes marquees "A ADAPTER") :
#   - person.votre_nom                  -> votre personne dans Home Assistant
#   - media_player.votre_haut_parleur   -> l'ecran / haut-parleur Google Cast
#   - ID_VIDEO_YOUTUBE                  -> l'identifiant de la video : dans
#     https://www.youtube.com/watch?v=AbC123xyz c'est AbC123xyz
#
# Necessite l'integration NHL API (v1.2+) ajoutee dans Parametres -> Appareils et
# services avec l'equipe BOS. Le capteur est trouve automatiquement.
# La voix vient de Home Assistant Cloud (tts.home_assistant_cloud), en francais
# du Quebec. Voix possibles : SylvieNeural (femme), AntoineNeural, JeanNeural,
# ThierryNeural (hommes).
- alias: "Bruins - annonce a l'arrivee a la maison"
  id: bruins_arrivee_maison  # garde l'historique (traces) des executions
  mode: single
  trigger:
    - platform: zone
      entity_id: person.votre_nom  # A ADAPTER
      zone: zone.home
      event: enter
  variables:
    haut_parleur: media_player.votre_haut_parleur  # A ADAPTER
    bruins_aujourdhui: >-
      {% set capteur = integration_entities('nhl_api') | select('match', 'sensor\\.') | first | default('') %}
      {% set debut = (state_attr(capteur, 'next_game_datetime') | string) if capteur else '' %}
      {{ debut[:10] == now().strftime('%Y-%m-%d') }}
    message: >-
      {# Le capteur cree par l'integration NHL API (ajoutee par les menus). #}
      {% set capteur = integration_entities('nhl_api') | select('match', 'sensor\\.') | first | default('') %}
      {% set a = states[capteur].attributes if capteur and states[capteur] else {} %}
      {# L'etat affiche la date du match ; game_state donne PRE, LIVE, FINAL... #}
      {% set etat = a.get('game_state', states(capteur) if capteur else '') %}
      {% set debut = a.get('next_game_datetime') | string %}
      {% set aujourdhui = debut[:10] == now().strftime('%Y-%m-%d') %}
      {% set visiteur = a.get('away_name', 'les visiteurs') %}
      {% set local = a.get('home_name', 'les locaux') %}
      {% set score = visiteur ~ ' ' ~ a.get('away_score', 0) ~ ', ' ~ local ~ ' ' ~ a.get('home_score', 0) %}
      {% if etat in ['LIVE', 'CRIT'] %}
        Les Bruins jouent en ce moment. {{ score }}.
        {% if a.get('is_intermission') %}C'est l'entracte après la période {{ a.get('current_period', '') }}.
        {% else %}Période {{ a.get('current_period', '') }}, il reste {{ a.get('time_remaining', '') }}.{% endif %}
      {% elif etat in ['OVER', 'FINAL', 'OFF'] and aujourdhui %}
        Le match des Bruins est terminé. Score final : {{ score }}.
      {% elif aujourdhui %}
        {% set heure = as_timestamp(a.get('next_game_datetime')) | timestamp_custom('%-H h %M') %}
        Les Bruins jouent aujourd'hui à {{ heure }} : {{ visiteur }} contre {{ local }}.
      {% else %}
        Les Bruins ne jouent pas aujourd'hui.
        {% if a.get('next_game_datetime') %}
          {% set mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] %}
          {% set ts = as_timestamp(a.get('next_game_datetime')) %}
          Prochain match le {{ ts | timestamp_custom('%-d') }} {{ mois[(ts | timestamp_custom('%-m') | int) - 1] }} à {{ ts | timestamp_custom('%-H h %M') }}.
        {% endif %}
      {% endif %}
  action:
    - service: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: "{{ haut_parleur }}"
        message: "{{ message | regex_replace('\\s+', ' ') | trim }}"
        language: fr-CA
        options:
          voice: SylvieNeural
    # Si les Bruins jouent aujourd'hui : laisser finir l'annonce, puis la video.
    - if:
        - condition: template
          value_template: "{{ bruins_aujourdhui }}"
      then:
        - delay: 15
        - service: media_player.play_media
          target:
            entity_id: "{{ haut_parleur }}"
          data:
            media_content_type: cast
            # A ADAPTER : remplacer ID_VIDEO_YOUTUBE (garder les guillemets)
            media_content_id: '{"app_name": "youtube", "media_id": "ID_VIDEO_YOUTUBE"}'
    # Pour aussi l'entendre sur le telephone Android, enlever les # ci-dessous
    # et mettre le nom de votre telephone :
    # - service: notify.mobile_app_votre_telephone
